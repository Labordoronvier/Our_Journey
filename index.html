<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet"> <!-- Cute font alternative -->
    <title>Journey of Us</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Dancing Script", cursive; /* Updated to a real font */
        background: #808080;
        overflow-x: hidden;
      }

      .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .album {
        transform-style: preserve-3d;
        transition: 1s;
        width: 600px;
        height: 700px;
        transform: scale(0.6);
        cursor: pointer;
        position: relative;
      }

      .album--open {
        transform: translate(0, 0) rotateX(10deg) rotateY(0deg) rotateZ(10deg);
      }

      .txt-text {
        position: absolute;
        top: 65%;
        color: rgb(78, 78, 78);
        left: 30%;
        z-index: 100;
        font-size: 4vw;
        text-align: center;
      }

      .album__paper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transition: 1s;
        transform-origin: 0 50%;
        transform-style: preserve-3d;
      }

      .album__paper:not(.first) .album__page {
        background: #f1f0f0;
        background-size: 100% 1.5em;
      }

      .album__paper:not(.first) .back {
        background: #d4d3d3;
      }

      .album__paper:nth-of-type(1) .back {
        background: #0095a3;
      }

      .album__paper:nth-of-type(1) .album__page {
        background: #0095a3;
      }

      .album__paper.open {
        box-shadow: 0 1em 0 0 #aaa;
        transform: rotateX(0) rotateY(-180deg) rotateZ(0);
      }

      .album__paper .album__page.front {
        transition: 1s;
        transform-origin: 0 50%;
        backface-visibility: hidden;
        z-index: 2;
      }

      .album__paper .back {
        transition: 1s;
        transform-origin: 0 50%;
        background: #e1e1e1;
      }

      .album__top-title {
        font-size: 100px;
        line-height: 0.8;
        padding: 20px;
      }

      .album__page {
        width: 100%;
        height: 100%;
        position: absolute;
        transform: translateZ(0px);
      }

      .album__back {
        width: 5%;
        height: 100%;
        background: #007e8a;
        position: absolute;
        left: -5%;
        top: 0;
        transform-origin: 100% 100%;
        transform: rotateY(-90deg) rotateX(0deg);
      }

      .album__shadow {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        transform: translateZ(-3em);
        box-shadow: 1em 1em 0px 0px #aaa;
        z-index: 1;
      }

      .album__bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 5%;
        background: #d4d3d3;
        transform-origin: 100% 100%;
        transform: rotateX(90deg);
      }

      .top-content {
        display: flex;
        flex-flow: column;
        height: 100%;
      }

      .content {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        box-sizing: border-box;
        padding: 0;
      }

      .content__title {
        font-size: 2rem;
        text-align: center;
        padding: 20px 0 10px;
        height: 80px;
      }

      .content__gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 10px;
        padding: 0 20px 20px;
        box-sizing: border-box;
        height: calc(100% - 100px);
      }

      .content__image {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 8px;
        background-color: #f9f9f9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content__image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 3px solid #fff;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      @media screen and (max-width: 768px) {
        .album {
          transform: scale(0.45);
        }
        .content__gallery {
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(2, 1fr);
          gap: 8px;
        }
        .txt-text {
          font-size: 3rem;
          left: 25%;
        }
        .album__top-title {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="container">
        <div class="album" :class="{'album--open': isOpenedTop}">
          <div
            class="album__paper"
            :style="{zIndex: isOpenedTop ? 0 : items.length + 1 }"
            :class="{'open': isOpenedTop}"
            @click="topOpen(isOpenedTop)">
            <div
              class="album__page front"
              :style="{transform: `translateZ(${0.1 * (items.length + 1)}em)`}">
              <div>
                <div class="album__top-title">Album</div>
                <p class="txt-text">Journey of Us</p>
              </div>
            </div>
            <div class="album__page back" :style="{zIndex: 0}"></div>
          </div>
          <div
            class="album__paper"
            v-for="(page, idx) in items"
            :key="idx + 1"
            :style="{zIndex: page.isOpen ? idx + 1 : items.length + 1 - (idx + 1) }"
            :class="{'open': page.isOpen}"
            @click="idx + 1 === items.length ? reset() : open(idx, page.isOpen)">
            <div
              class="album__page front"
              :style="{transform: `translateZ(${0.1 * (items.length + 1 - (idx + 1))}em)`}">
              <div class="content">
                <div class="content__title">{{ page.title }}</div>
                <div class="content__gallery">
                  <div class="content__image" v-for="(img, i) in page.images" :key="i">
                    <img :src="img" :alt="`${page.title} - Photo ${i + 1}`" loading="lazy" @error="handleImageError" />
                  </div>
                </div>
              </div>
            </div>
            <div class="album__page back" :style="{zIndex: idx + 1}"></div>
          </div>
          <div class="album__back"></div>
          <div class="album__bottom"></div>
          <div class="album__shadow"></div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.11/vue.min.js"></script>

            {

            {

                'pic35.jpeg',

              ],
              isOpen: false
            },
          ]
        },
        methods: {
          topOpen(state) {
            this.isOpenedTop = !state;
          },
          open(index, state) {
            this.items[index].isOpen = !state;
          },
          reset() {
            this.items.forEach(item => (item.isOpen = false));
            this.isOpenedTop = false;
          },
          handleImageError(event) {
            event.target.src = 'placeholder.jpg'; // Add a placeholder image if available
          }
        }
      });
    </script>
  </body>
</html>
